<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English C2 — Zakria's English</title>
<meta name="theme-color" content="#F4F5F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F4F5F2;--surface:#fff;--ink:#16201E;--ink2:#3F4A47;--muted:#7A8582;--line:#E4E8E5;--line2:#EEF1EF;
 --brand:#0F766E;--brand-soft:#DDF1EE;--pr:#2F6FB3;--new:#D9E8FB;--learn:#FCEFC0;--green:#2E8B57;--green-soft:#E3F3E9;--red:#C2412D;--red-soft:#FBE9E5;--amber:#B7791F;
 --r:18px;--sh:0 1px 2px rgba(10,30,25,.04),0 6px 20px rgba(10,30,25,.06);
 --ar:"Noto Naskh Arabic","Segoe UI","Tahoma",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pr)}
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0}
.wrap{max-width:820px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(100px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.tabbar button,.side nav button{background:none;border:0;cursor:pointer;color:var(--muted)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:4px 0;position:relative}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--brand)}
.tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px}
@media (min-width:900px){
 .side{display:flex;flex-direction:column;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
 .side .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 10px 22px}
 .side .logo img{width:36px;height:36px;border-radius:10px}
 .side nav{display:flex;flex-direction:column;gap:4px}
 .side nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:15px;text-align:left}
 .side nav button svg{width:22px;height:22px}
 .side nav button.on{background:var(--brand-soft);color:var(--brand)}
 .side nav button:hover:not(.on){background:var(--line2);color:var(--ink)}
 .side .mini{margin-top:auto;padding:14px;border-radius:14px;background:var(--bg);font-size:13px;color:var(--muted)}
 .side .mini b{display:block;font-size:26px;color:var(--ink)}
 .tabbar{display:none}
 .wrap{padding:36px 36px 60px}
}
.hdr{display:flex;align-items:flex-end;gap:12px;margin:4px 0 18px}
.hdr h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em}
.hdr .sub{color:var(--muted);font-size:14px;margin-top:2px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px} .row.wrap2{flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:0 0 14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.brand{background:var(--brand)} .btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.soft{background:var(--line2);color:var(--ink)} .btn.wide{width:100%} .btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.red{background:var(--red)} .btn.green{background:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.iconbtn{border:0;background:var(--line2);border-radius:99px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink2)}
.iconbtn svg{width:20px;height:20px} .iconbtn:hover{background:var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin-bottom:12px}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chip.sm{padding:4px 10px;font-size:13px}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;vertical-align:2px;background:var(--line2);color:var(--ink2)}
.tag.b{background:var(--brand-soft);color:var(--brand)} .tag.p{background:#ECE6F7;color:#6A4BA8} .tag.o{background:#FFF0DC;color:#9A5B00} .tag.r{background:var(--red-soft);color:var(--red)} .tag.g{background:var(--green-soft);color:var(--green)} .tag.blue{background:var(--new);color:var(--pr)}
.muted{color:var(--muted)} .small{font-size:13px}
.ipa{color:var(--pr);font-weight:500;font-size:15px;font-family:"Lucida Sans Unicode","DejaVu Sans",Inter,sans-serif}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.note{background:var(--line2);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;color:var(--ink2)}
.note.warn{background:#FFF6E0}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;outline:none}
textarea{resize:vertical;min-height:120px;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--brand)}
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 5px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spk{border:0;background:var(--brand-soft);color:var(--brand);border-radius:99px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;gap:4px}
.spk svg{width:20px;height:20px} .spk.sm{width:32px;height:32px} .spk.sm svg{width:16px;height:16px}
.spk.lbl{width:auto;padding:0 10px;font-size:12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px} th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top} thead th{border-top:0;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px} details>summary::-webkit-details-marker{display:none} details>summary::before{content:"›";font-size:20px;color:var(--muted);transition:transform .2s;display:inline-block;width:14px} details[open]>summary::before{transform:rotate(90deg)}
.hero{background:linear-gradient(135deg,#10322E,#16514A);color:#fff;border-radius:24px;padding:22px;display:flex;gap:18px;align-items:center;box-shadow:var(--sh)}
.hero .muted{color:#BFD8D3}
.ring{flex:none;width:96px;height:96px;position:relative}
.ring svg{transform:rotate(-90deg)} .ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1.05}
.ring b small{font-size:11px;font-weight:500;color:#BFD8D3}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:14px 16px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.click{cursor:pointer} .stat.click:hover{box-shadow:0 0 0 2px var(--line),var(--sh)}
.bar{height:6px;border-radius:9px;background:var(--line2);overflow:hidden;display:flex} .bar i{display:block;height:100%}
.list .item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)} .list .item:first-child{border-top:0}
.item.click{cursor:pointer}
/* flashcards */
.flash{min-height:440px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px}
.flash .meta{align-self:stretch;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.flash .big{font-size:38px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.flash .exs{font-family:"Source Serif 4",Georgia,serif;font-size:18px;color:var(--ink2);max-width:560px}
.flash .exs b{color:var(--ink)}
.ans{align-self:stretch;border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.grades{align-self:stretch;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
.grades.two{grid-template-columns:repeat(2,1fr)}
.grades button{border:0;border-radius:14px;padding:11px 4px;color:#fff;font-weight:700;cursor:pointer}
.grades small{display:block;font-weight:500;opacity:.9;font-size:12px}
.g1{background:#C2412D} .g2{background:#B7791F} .g3{background:#2E8B57} .g4{background:#2F6FB3}
.kbd{font-size:12px;color:var(--muted);text-align:center}
/* reader */
.lib{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.lib{grid-template-columns:1fr 1fr}}
.book{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.book:hover{box-shadow:0 0 0 2px var(--line),var(--sh)} .book .t{font-weight:700;font-size:16px;line-height:1.3}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(244,245,242,.94);backdrop-filter:blur(10px);padding:10px 0;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reader{font-family:"Source Serif 4",Georgia,serif;font-size:21px;line-height:1.8}
.reader p{margin:0 0 16px}
.reader .line{display:flex;gap:10px;margin:0 0 12px}
.reader .who{font-family:Inter,sans-serif;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--brand);min-width:88px;padding-top:6px}
.sent{border-radius:6px;transition:background .2s} .sent.playing{background:#FFF1C9}
.wd{cursor:pointer;border-radius:5px;padding:0 1px;margin:0 -1px;transition:background .15s,box-shadow .15s}
.st-new{background:var(--new)} .st-rare{background:transparent;border-bottom:1.5px dashed #aab4b1;border-radius:0} .st-learning{background:var(--learn)} .st-known{background:transparent} .st-ignored{background:transparent}
.wd.ph{border-bottom:2px solid rgba(47,111,179,.55);border-radius:5px 5px 0 0}
.wd.ph.st-learning{border-bottom-color:#D4A800} .wd.ph.st-known{border-bottom:2px dotted #b9c2bf}
.wd:hover{box-shadow:0 0 0 2px rgba(15,118,110,.35)} .wd.sel{box-shadow:0 0 0 2px var(--brand)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;font-weight:600}
.legend i{display:inline-block;width:14px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
#pop{position:absolute;z-index:40;background:var(--surface);border-radius:20px;box-shadow:0 18px 50px rgba(10,30,25,.22),0 0 0 1px var(--line);padding:16px 18px;width:420px;max-height:76vh;overflow:auto;display:none;font-size:15px;line-height:1.45}
#pop.sheet{position:fixed;left:0;right:0;bottom:0;width:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:82vh}
#pop.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#pop .w{font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
#pop .armain{font-size:24px;font-weight:700;margin-top:8px;line-height:1.5}
#pop .sense{padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
#pop .ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2);font-family:"Source Serif 4",Georgia,serif;font-size:16px}
#pop .ex .src{font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
#pop h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.colls{display:flex;flex-wrap:wrap;gap:6px}
.colls span{background:var(--line2);border-radius:8px;padding:3px 9px;font-size:14px}
.colls button{border:0;cursor:pointer}
#scrim{position:fixed;inset:0;background:rgba(10,20,18,.28);z-index:35;display:none}
/* placement */
.ptest{text-align:center;padding:30px 18px}
.ptest .w{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:24px 0}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn button{border:0;border-radius:16px;padding:18px;font-weight:800;font-size:18px;cursor:pointer;color:#fff}
/* spelling */
.diff{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:26px;letter-spacing:.04em;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin:10px 0}
.diff span{display:inline-flex;flex-direction:column;align-items:center;min-width:.8em;border-radius:6px;padding:2px 2px}
.diff .ok{color:var(--green)} .diff .bad{background:var(--red-soft);color:var(--red)} .diff .miss{background:var(--red-soft);color:var(--red);text-decoration:underline} .diff .extra{color:var(--red);text-decoration:line-through;opacity:.7}
.diff small{font-size:12px;line-height:1;color:var(--muted)}
.bigin{font-size:24px;text-align:center;padding:14px;letter-spacing:.02em}
.sentdiff{font-size:19px;line-height:1.9}
.sentdiff .okw{color:var(--green)} .sentdiff .badw{background:var(--red-soft);color:var(--red);border-radius:5px;padding:0 4px}
/* writing */
.editor{min-height:340px;font-family:"Source Serif 4",Georgia,serif;font-size:18px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line2);font-size:14px;cursor:pointer} .chk:first-child{border-top:0}
.flag{background:var(--red-soft);color:var(--red);border-radius:8px;padding:2px 8px;font-weight:600;cursor:pointer;border:0;font-size:14px}
.chart{width:100%;height:auto;background:#fff;border-radius:12px}
.proc{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.proc div{background:var(--line2);border-radius:10px;padding:8px 12px;font-size:14px;counter-increment:s} .proc div::before{content:counter(s) ". ";font-weight:800;color:var(--brand)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
.pair{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qsel{display:inline-block;width:auto;padding:2px 8px;border-radius:8px;font-size:16px;font-weight:700}
.qsel.okq{border-color:var(--green);background:var(--green-soft)} .qsel.badq{border-color:var(--red);background:var(--red-soft)}
.unit{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line2);cursor:pointer} .unit:first-child{border-top:0}
.unit .num{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.unit.done .num{background:var(--green);color:#fff}
.counter{display:flex;gap:14px;align-items:center}
.counter .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.pill{border:0;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;flex:none}
.pill.new{background:var(--new);color:var(--pr)} .pill.learning{background:var(--learn);color:#8a6400} .pill.known{background:var(--green-soft);color:var(--green)} .pill.learned{background:var(--brand);color:#fff}
.qa{padding:10px 0;border-top:1px solid var(--line2)} .qa:first-child{border-top:0}
.qa .a{display:none;color:var(--green);font-weight:600;margin-top:4px} .qa.open .a{display:block}
.mcq{display:grid;gap:8px;margin-top:12px} .mcq button{border:0;background:var(--line2);border-radius:12px;padding:12px;text-align:left;font-weight:600;cursor:pointer}
.mcq button.okq{background:var(--green-soft);color:var(--green)} .mcq button.badq{background:var(--red-soft);color:var(--red)}
.seg{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:3px;margin:0 0 14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
</style>
</head>
<body>
<div class="shell">
 <aside class="side" id="side"></aside>
 <div class="main"><div class="wrap" id="app"><div class="empty">Loading…</div></div></div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="scrim"></div>
<div id="pop"></div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
// ================= helpers =================
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const dkey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const today = () => dkey(new Date());
const endOfToday = () => { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); };
const MIN = 60000, DAY = 86400000;
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); }
const svgi = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home: svgi('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  read: svgi('<path d="M2 5h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>'),
  cards: svgi('<rect x="3" y="7" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/>'),
  write: svgi('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  plan: svgi('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  words: svgi('<path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/>'),

function align(a, b) { // a typed, b correct → ops

  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  const ops = []; let i = n, j = m;
  while (i > 0 || j > 0) {

    else { ops.unshift(['extra', a[i - 1]]); i--; }

}

function go(view) { S.view = view; shown = false; if (view === 'read') { S.rd = null; } if (view === 'place') { S.pt = null; } if (view === 'plan') { S.hwu = null; S.gram = null; S.cq = null; S.idi = null; S.iq = null; } if (view === 'write') S.wtask = null; if (S.playing) { S.playing = false; speechSynthesis.cancel(); } render(); scrollTo(0, 0); if (view === 'review') setTimeout(autoplayFront, 80); }

  if (d.fix) { const [bad, good] = d.fix.split('|'); return fixWord(bad, good); }
  if (d.wsave) return saveEssay();
  if (d.wtab) { S.wtab = d.wtab; S.dc = null; S.pq = null; return render(); }
  if (d.dcsay) return sayDict(d.dcsay === 'slow');
  if (d.dchint) { const it = S.dc.items[S.dc.i]; const e2 = await entryOf(lemmaOf(it.w)); $('#dcHint').textContent = e2 ? ((e2.arw && e2.arw[0] && e2.arw[0][1]) || (e2.s && e2.s[0] && e2.s[0].d) || '') : ''; return; }
  if (d.dccheck) return checkDict();
  if (d.dcnext) { S.dc.i++; S.dc.cur = null; render(); return setTimeout(() => sayDict(), 120); }
  if (d.dcquit) { S.dc = null; return render(); }
  if (d.spdeck) { S.deck = 's'; cur = null; return go('review'); }
  if (d.pq) return startPairQuiz();
  if (d.pqcheck) return pairCheck();
  if (d.pqnext) { S.pq.i++; return render(); }
  if (d.pqquit) { S.pq = null; return render(); }
  if (d.rf) { S.readFilter = d.rf; return render(); }
  if (d.closetext) { S.rd = null; if (S.playing) { S.playing = false; speechSynthesis.cancel(); } render(); return scrollTo(0, 0); }
  if (d.playall) return playAll();
  if (d.togtrans) { S.rd.showT = !S.rd.showT; return render(); }
  if (d.showa !== undefined) { t.closest('.qa').classList.add('open'); t.remove(); return; }
  if (d.finish !== undefined) return finishText(d.finish === '1');
  if (d.deltext) { if (confirm('Delete this text?')) { S.my = S.my.filter(x => x.id !== d.deltext); saveMy(); S.rd = null; render(); } return; }
  if (d.deck) { S.deck = d.deck; cur = null; shown = false; render(); return setTimeout(autoplayFront, 80); }
  if (d.grade) return grade(+d.grade);
  if (d.knowcard) return knowCard();
  if (d.wf) { S.wordFilter = d.wf; return render(); }
  if (d.pa !== undefined) return placeAnswer(d.pa === '1');
  if (t.id === 'ptStart') return startPlacement();
  if (t.id === 'ptQuit') { S.pt = null; return render(); }
  if (t.id === 'show') { shown = true; render(); if (S.prog.prefs.dir === 'ar') { const m = S.prog.meta[cur]; m && speak(m.k.replace(/^p:/, '')); } return; }
  if (t.id === 'spCheck') return spellCheck();
  if (t.id === 'imSave') return saveImport();
  if (t.id === 'misAddBtn') { const v = $('#misAdd').value.trim().toLowerCase(); if (v) { addSpell(v); toast('Added to your spelling cards'); render(); } return; }
  if (t.id === 'dictGo') { const v = $('#dictQ').value.trim().toLowerCase(); if (v) lookup(v.includes(' ') ? (S.core.mwe[v] ? 'p:' + v : lemmaOf(v.split(' ')[0])) : lemmaOf(v)); return; }
  if (t.id === 'export') return exportData();
  if (t.id === 'importBtn') return $('#importFile').click();
  if (t.id === 'dictCheck') { if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('dict-status'); else toast('Offline mode starts after the app is reloaded once'); return; }
  if (t.id === 'install' && S.installEvt) { S.installEvt.prompt(); S.installEvt.userChoice.finally(() => { S.installEvt = null; render(); }); }
});
// select several words in the reader → look up the phrase
document.addEventListener('mouseup', () => {
  if (S.view !== 'read' || !S.rd) return;
  const s = String(getSelection() || '').trim(); if (!s.includes(' ') || s.length > 60) return;
  const words = wordsOf(s); if (words.length < 2 || words.length > 6) return;
  const key = words.join(' '), lk = words.map(lemmaOf).join(' ');
  const k = S.core.mwe[key] ? key : S.core.mwe[lk] ? lk : null;
  if (k) lookup('p:' + k); else { lookup('p:' + key); }
});
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('.wd');
  if (!el || popPinned || !matchMedia('(hover: hover) and (pointer: fine)').matches || innerWidth < 640) return;
  clearTimeout(popTimer); popTimer = setTimeout(() => showPop(el, false), 120);
});
document.addEventListener('mouseout', e => {
  if (popPinned || !e.target.closest || !e.target.closest('.wd, #pop')) return;
  clearTimeout(popTimer); popTimer = setTimeout(() => { if (!$('#pop').matches(':hover') && !document.querySelector('.wd:hover')) hidePop(); }, 350);
});
document.addEventListener('change', e => {
  const id = e.target.id, p = S.prog.prefs;
  if (id === 'importFile' && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; return; }
  if (id === 'npd' || id === 'npd2') { p.newPerDay = +e.target.value; saveProg(); render(); }
  if (id === 'goal') { p.goal = +e.target.value; saveProg(); render(); }
  if (id === 'dir') { p.dir = e.target.value; saveProg(); cur = null; render(); }
  if (id === 'voice') { p.voiceName = e.target.value; p.voice = 'en-US'; saveProg(); speak('Hello, this is the new voice.'); }
  if (id === 'rareNew') { p.rareNew = e.target.value === '1'; saveProg(); }
  if (id === 'rate') { p.rate = +e.target.value; saveProg(); }
  if (id === 'planMin') { p.minutes = +e.target.value; saveProg(); render(); }
  if (e.target.dataset.wchk !== undefined) { (S.prog.checks[S.wtask] ||= {})[e.target.dataset.wchk] = e.target.checked; saveProg(); }
  if (e.target.dataset.wband !== undefined) { (S.wb ||= [6, 6, 6, 6])[+e.target.dataset.wband] = +e.target.value; $('#wOverall').textContent = overall(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hidePop(true);
  if (S.view === 'read' && S.rd && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey) { if (readerKey(e)) { e.preventDefault(); return; } }
  const tag = e.target.tagName;
  if (S.view === 'place' && S.pt && !S.pt.done) { const k = e.key.toLowerCase(); if (k === 'y' || k === 'arrowright') placeAnswer(true); if (k === 'n' || k === 'arrowleft') placeAnswer(false); return; }
  if (S.view === 'write' && S.dc && e.key === 'Enter' && !e.shiftKey && !S.wtask) { e.preventDefault(); if (S.dc.cur) { S.dc.i++; S.dc.cur = null; render(); setTimeout(() => sayDict(), 120); } else if ($('#dcIn')) checkDict(); return; }
  if (S.view === 'review' && cur && S.prog.meta[cur] && S.prog.meta[cur].t === 's') { if (e.key === 'Enter') { e.preventDefault(); if (!spellRes) spellCheck(); else grade(spellRes.ok ? 3 : 1); } return; }
  if (S.view !== 'review' || /INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (e.key === ' ' && !shown) { e.preventDefault(); $('#show') && $('#show').click(); }
  else if (shown && '1234'.includes(e.key)) grade(+e.key);
  else if (e.key.toLowerCase() === 'p' && cur) speak(S.prog.meta[cur].k.replace(/^p:/, ''));
});

// ================= start =================
(async () => {
  loadLocal();
  try {
    const get = async u => { const r = await fetch(u); if (!r.ok) throw new Error(u); return r.json(); };
    const [core, fakes, texts, learn, colloc] = await Promise.all([get('dict/core.json'), get('dict/fakes.json'), get('content/texts.json'), get('content/learn.json'), get('content/colloc.json')]);
    S.colloc = colloc; S.core = core; S.fakes = fakes; S.texts = texts.texts; S.learn = learn;
    core.lemmas.forEach((l, i) => S.R[l] = i + 1); S.COMMON = Math.max(10000, (core.zipf || []).findIndex(z => z < 3) || 15000); S.F = core.forms; S.prof = new Set(core.prof || []);
    S.awlMap = core.awl || {}; AWLSET = new Set(Object.keys(S.awlMap));
    buildMWE();
  } catch (err) { console.error(err); $('#app').innerHTML = '<div class="empty">Could not load the app data. Check your connection and reopen the app.</div>'; return; }
  render(); setupStandalone();
})();
})();
</script>
